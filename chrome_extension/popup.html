<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <style>
    body{font:13px system-ui,Segoe UI,Arial;color:#0f172a;width:300px;margin:0;padding:14px}
    h1{font-size:15px;margin:0 0 8px}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
    .ok{background:#059669}.err{background:#dc2626}
    button{width:100%;margin-top:10px;padding:9px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font:600 13px system-ui;cursor:pointer}
    button.sec{background:#fff;color:#334155;border:1px solid #cbd5e1}
    .muted{color:#64748b;font-size:12px;margin-top:8px}
    #last{margin-top:8px;font-size:12px;white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>Asystent KRZ — Dziennik Upadłościowy</h1>
  <div id="conn"><span class="dot err"></span>sprawdzam połączenie…</div>
  <button id="run">🔍 Sprawdź KRZ teraz</button>
  <button id="opts" class="sec">Ustawienia</button>
  <div id="last" class="muted"></div>
  <script src="popup.js"></script>
</body>
</html>
